<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Self-hosted fonts. Only the two faces used above the fold are preloaded;
         everything else is fetched on demand via its unicode-range. -->
    <link rel="preload" href="/fonts/marcellus-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!--
      Development shell. In a production build this file is replaced entirely by
      the prerendered document for each route — see src/Document.tsx, which owns
      the <head> so React can hoist each page's title and meta tags into it.

      The tags above must stay in sync with src/Document.tsx; `npm run build`
      fails if they drift apart.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
